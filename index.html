<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
   <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesButton">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <dialog id="imageDialog" class="image-dialog" aria-labelledby="dialogTitle">
      <button id="closeDialogButton" class="dialog-close" type="button" aria-label="Close image details">&times;</button>
      <img id="dialogImage" class="dialog-image" alt="" />
      <div class="dialog-content">
        <h2 id="dialogTitle"></h2>
        <p id="dialogDate" class="dialog-date"></p>
        <p id="dialogExplanation" class="dialog-explanation"></p>
      </div>
    </dialog>
  </div>

 
  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
